<!DOCTYPE html>
<html><head><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Camera30 - Katrina + Jeran FIXED</title>
<style>body{font-family:sans-serif;text-align:center;background:#111;color:white}video{width:95%;max-width:400px}canvas{border:3px solid yellow;width:96px;height:96px}button{font-size:20px;padding:12px;margin:6px}#log{color:yellow;text-align:left;padding:10px;font-size:16px}#person{font-size:24px;padding:8px}#timer{font-size:22px;color:#ff0}#diff{font-size:18px;color:#0ff}</style></head>
<body>
<h2>Camera30 - Katrina First! FIXED 60+</h2>
<div>Server + Camera + AI = THIS PHONE!</div>
<div>ESP32: 10.83.23.188</div>
<div>Difference Need: 55 | Instant Send: 0.55+</div>
<div id="person">⏳ Tap Start...</div>
<div id="timer">Timer: --</div>
<div id="diff">Difference: --</div>
<video id="video" autoplay playsinline muted></video><br>
<button onclick="start()">▶ Start</button>
<button onclick="setBackground()">📸 Set Background</button>
<button onclick="resetNow()">🔄 Reset</button>
<div id="result">Waiting...</div>
<div>👇 YELLOW BOX:</div>
<canvas id="canvas" width="96" height="96"></canvas>
<div id="log">Log...</div>
<br>
<button onclick="sendManually('/katrina')">KATRINA</button>
<button onclick="sendManually('/jeran')">JERAN</button>
<button onclick="sendManually('/unknown')">UNKNOWN</button>
<script src="edge-impulse-standalone.js"></script>
<script src="run-impulse.js"></script>
<script>
const ESP32="http://10.83.23.188";
const DIFF_THRESHOLD=55, SCAN_TIME=3500;
let confirmCount=0, lastTop="", bestScore=0, bestTop="", background=null, personConfirmed=false, personStartTime=0, alreadySent=false, isCoolingDown=false, noPersonCount=0;
function log(m){document.getElementById('log').innerHTML+="<br>"+m;}
function resetNow(){ log("🔄 RESET"); personConfirmed=false; personStartTime=0; alreadySent=false; confirmCount=0; lastTop=""; bestScore=0; bestTop=""; isCoolingDown=false; noPersonCount=0; }
function drawCenterCrop() {
  let video=document.getElementById('video');
  let c=document.getElementById('canvas');let ctx=c.getContext('2d');
  let vw=video.videoWidth, vh=video.videoHeight;
  let s=Math.min(vw, vh);
  let sx=(vw-s)/2, sy=(vh-s)/2;
  ctx.drawImage(video, sx, sy, s, s, 0, 0, 96, 96);
}
function setBackground(){ drawCenterCrop(); let c=document.getElementById('canvas');let ctx=c.getContext('2d'); background=ctx.getImageData(0,0,96,96).data.slice(); log("📸 Background saved!"); personConfirmed=false; }
function sendToESP32(path, reason){ log(reason+" -> SENDING: "+path); fetch(ESP32+path+"?t="+Date.now(),{mode:'no-cors'}).catch(e=>{}); let i=new Image(); i.src=ESP32+path+"?t="+Date.now(); }
function sendManually(p){ log("Manual: "+p); sendToESP32(p,"Manual"); }
function finishScan(){
  alreadySent=true; isCoolingDown=true;
  setTimeout(()=>{ personConfirmed=false; alreadySent=false; confirmCount=0; lastTop=""; bestScore=0; bestTop=""; isCoolingDown=false; noPersonCount=0; log("🔄 Ready for NEXT person!"); }, 4000);
}
async function start(){
  log("Opening THIS phone's BACK camera...");
  try {
    let stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment", width: {ideal:640}, height: {ideal:480} }, audio: false });
    let video = document.getElementById('video');
    video.srcObject = stream;
    await video.play();
    log("✅ BACK Camera ON!");
  } catch(e){ log("❌ Camera blocked!"); return; }
  let classifier=new EdgeImpulseClassifier(); await classifier.init();
  log("Model LOADED! Point at EMPTY wall 2 sec...");
  setTimeout(()=>{
    drawCenterCrop();
    let c=document.getElementById('canvas');let ctx=c.getContext('2d');
    background=ctx.getImageData(0,0,96,96).data.slice();
    log("📸 Background AUTO-saved!");
  },2000);
  setInterval(async()=>{
    let video=document.getElementById('video');
    if(!video.videoWidth) return;
    drawCenterCrop();
    let c=document.getElementById('canvas');let ctx=c.getContext('2d');
    let d=ctx.getImageData(0,0,96,96).data;
    let f=[];for(let i=0;i<d.length;i+=4){f.push((d[i]+d[i+1]+d[i+2])/3);}
    let res=classifier.classify(f);
    let katrina=0,jeran=0,txt="";
    for(let r of res.results){ txt+=r.label+":"+r.value.toFixed(2)+" "; if(r.label.toLowerCase().includes("katrina")) katrina=r.value; if(r.label.toLowerCase().includes("jeran")) jeran=r.value; }
    document.getElementById('result').textContent=txt;
    if(isCoolingDown){ document.getElementById('person').textContent="✅ Sent! Cooling down..."; return; }
    if(!background) return;
    let diffSum=0, count=0;
    for(let i=0;i<d.length;i+=16){ diffSum+=Math.abs(d[i]-background[i]); count++; }
    let diffAvg=diffSum/count;
    document.getElementById('diff').textContent="Difference: "+diffAvg.toFixed(1)+" (Need >55)";
    let hasPerson = diffAvg > DIFF_THRESHOLD;
    if(!hasPerson){
      noPersonCount++;
      // FIX: Only reset after 3x No Person in a row, not 1 flicker!
      if(noPersonCount>=3 && !alreadySent){
        document.getElementById('person').textContent="⏳ No Person - Diff "+diffAvg.toFixed(1);
        document.getElementById('timer').textContent="Timer: NOT started";
        personConfirmed=false; personStartTime=0; alreadySent=false; confirmCount=0; lastTop=""; bestScore=0; bestTop=""; noPersonCount=0;
      }
      return;
    }
    noPersonCount=0;
    if(!personConfirmed){ personConfirmed=true; personStartTime=Date.now(); alreadySent=false; confirmCount=0; lastTop=""; bestScore=0; bestTop=""; log("✅ PERSON DETECTED! Starting 3.5-sec scan..."); }
    if(alreadySent) return;
    let elapsed=Date.now()-personStartTime;
    let remaining=Math.max(0,SCAN_TIME-elapsed);
    document.getElementById('person').textContent="✅ PERSON! Scanning...";
    document.getElementById('timer').textContent="Scanning: "+(remaining/1000).toFixed(1)+"s left";
    let top="", score=0;
    if(katrina>0.30 && katrina>=jeran){ top="Katrina"; score=katrina; }
    else if(jeran>0.30 && jeran>=katrina){ top="Jeran"; score=jeran; }
    if(top!=""){
      if(top==lastTop){ confirmCount++; } else { lastTop=top; confirmCount=1; }
      if(score > bestScore){ bestScore=score; bestTop=top; }
      // FIX 1: If 0.55+ send INSTANTLY! Don't wait for 2nd!
      if(score>=0.55){ sendToESP32("/"+top.toLowerCase(), "INSTANT HIGH CONF: "+top+" Score: "+score.toFixed(2)); finishScan(); return; }
      // Otherwise need 2x for low scores 0.30-0.54
      if(confirmCount>=2){ sendToESP32("/"+top.toLowerCase(), "IDENTIFIED: "+top+" Score: "+score.toFixed(2)); finishScan(); return; }
    }
    if(elapsed>=SCAN_TIME){
      if(bestScore>0.30 && bestTop!=""){
        sendToESP32("/"+bestTop.toLowerCase(), "TIMEOUT but BEST was: "+bestTop+" Score: "+bestScore.toFixed(2));
      } else {
        sendToESP32("/unknown", "TIMEOUT - No one found, best: "+bestScore.toFixed(2));
      }
      finishScan();
    }
  },1000);
}
</script></body></html>
